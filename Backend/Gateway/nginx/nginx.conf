worker_processes 1;

events {
    worker_connections 1024;
}

http {
    # All traffic goes to Kong. Add more Kong instances here to load balance.
    upstream kong_gateway {
        server kong:8000;
        # server kong-2:8000;
        # server kong-3:8000;
    }

    server {
        listen 80;

        # nginx edge health check
        location = /health {
            default_type application/json;
            return 200 '{"success":true,"message":"nginx edge ok"}';
        }

        # forward everything to Kong (which routes /api/* to the services)
        location / {
            proxy_pass http://kong_gateway;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
